<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102033"><link rel="manifest" href="manifest.webmanifest"><title>Casa Avisos</title><link rel="stylesheet" href="styles.css"></head><body><main class="app"><header class="top"><div class="brand"><div class="brand-mark">⌂</div><div><h1>Casa Avisos</h1><p>Mensagens na sua TV, para uma casa mais conectada.</p></div></div><button class="icon-button" id="settings" aria-label="Configurações">⚙</button></header><button class="install-banner" id="install" hidden>＋ Instalar Casa Avisos no celular</button><section class="tv-card"><div class="tv-icon">▣</div><div><span>TV DA SALA</span><strong id="tvName">TV da sala</strong><div class="online"><i id="dot"></i><span id="connection">Verificando conexão…</span></div></div></section><section class="quick-grid" id="quickGrid"></section><section class="message-card"><h2>Enviar uma mensagem para a TV</h2><div class="composer"><textarea id="message" placeholder="Escreva sua mensagem…" rows="2"></textarea><button class="send" id="send">➤<span>Enviar</span></button></div></section><section class="tasks-card"><div class="section-title"><h2>Tarefas da casa</h2><button class="small-action" id="addTask">＋ Adicionar</button></div><div id="tasks"></div></section><p class="status" id="status">Pronto</p></main><dialog id="settingsDialog"><form method="dialog"><button class="close" value="cancel">×</button><h2>Configurações</h2><label>Endereço local da TV<input id="tvIp" inputmode="decimal" placeholder="192.168.100.108"></label><label>Nome da TV<input id="tvLabel" placeholder="TV da sala"></label><button class="primary" value="save">Salvar configurações</button></form></dialog><script src="install.js"></script><script src="app.js"></script><script src="sounds.js"></script></body></html>
